<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oldagram</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="post">
      <div class="post-top">
        <img class="logo" src="images/logo.png" alt="oldagram logo" />
        <img class="per" src="images/user-avatar.png" alt="per avatar" />
      </div>
      <div class="post-middle">
        <div class="post-author">
          <img class="author-avatar" src="images/avatar-vangogh.jpg" alt="van gogh social media avatar" />
          <div class="author-details">
            <div class="full-name">Vincent van Gogh</div>
            <div class="location">Zundert, Netherlands</div>
          </div>
        </div>
        <img
          class="van-gogh"
          src="images/post-vangogh.jpg"
          alt="vincent van gogh portrait"
        />
      </div>
      <div class="post-bottom">
        <div class="icon-row">
          <img class="icon" src="images/icon-heart.png" alt="">
          <img class="icon" src="images/icon-comment.png" alt="">
          <img class="icon" src="images/icon-dm.png" alt="">
        </div>
        <div class="likes">21,492 likes</div>
        <div class="text"><strong>vincey1853</strong> just took a few mushrooms lol</div>
      </div>
    </div>
  </body>
</html>
